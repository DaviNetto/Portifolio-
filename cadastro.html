<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Site do Davi</title>
    <link rel="stylesheet" href="cadastro.css">
</head>
<body>

    <main class="cadastro-container">
        <div class="navegacao-container">
            <a href="index.html" class="btn-portfolio">← Ir para o Portfólio</a>
        </div>

        <form id="formCadastro">
            <fieldset>
                <legend>Dados Pessoais</legend>
               
                <div>
                    <label for="nome">Nome Completo:</label>
                    <input type="text" id="nome" name="nome" placeholder="Ex: João Silva" required>
                </div>

                <div>
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email" placeholder="email@exemplo.com" required>
                </div>

                <div>
                    <label for="senha">Senha:</label>
                    <input type="password" id="senha" name="senha" required>
                </div>
            </fieldset>

            <fieldset>
                <legend>Informações Adicionais</legend>

                <div>
                    <label for="nascimento">Data de Nascimento:</label>
                    <input type="date" id="nascimento" name="nascimento">
                </div>

                <div class="genero-container">
                    <label class="label-titulo">Gênero:</label>
                    <div class="radio-group">
                        <input type="radio" id="masc" name="genero" value="M">
                        <label for="masc">Masculino</label>
                        
                        <input type="radio" id="fem" name="genero" value="F">
                        <label for="fem">Feminino</label>
                    </div>
                </div>
            </fieldset>

            <button type="submit">Finalizar Cadastro</button>
        </form>
    </main>

    <script>
        document.getElementById('formCadastro').addEventListener('submit', function(event) {
            event.preventDefault(); 
            alert('Cadastro realizado com sucesso! Redirecionando para o portfólio...');
            window.location.href = "index.html"; 
        });
    </script>
</body>
</html>
